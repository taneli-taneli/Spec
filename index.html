<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Sheet</title>
    <style>
      @import url("https://use.typekit.net/ndz3dvu.css");

      @page {
        size: 11.5in 17in;
        margin: 0;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
        font-family: "gunter", serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 12px;
        box-sizing: border-box;
      }

      .sheet {
        width: min(11.5in, calc(100vw - 24px));
        height: auto;
        aspect-ratio: 11.5 / 17;
        background: #ffffff;
        position: relative;
        overflow: hidden;
      }

      .spec-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "gunter", serif;
        font-size: clamp(72px, 12vw, 260px);
        line-height: 1;
        letter-spacing: 0.08em;
        color: #000000;
        z-index: 2;
        pointer-events: none;
        transition: transform 0.5s ease, opacity 0.45s ease, letter-spacing 0.45s ease;
        transform: scale(1);
        opacity: 1;
      }

      .spec-label.animating {
        transform: scale(1.08);
        opacity: 0.7;
        letter-spacing: 0.14em;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #ffffff;
        position: absolute;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="sheet" aria-label="11.5 by 17 inch print sheet">
      <canvas id="posterCanvas"></canvas>
      <div class="spec-label">SPEC</div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
